<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>图谱拖拽跟随 · 方案对比</title>
<style>
  :root {
    --bg: #0e1117;
    --panel: #141922;
    --line: #232b37;
    --text: #d7dee8;
    --muted: #7e8a9a;
    --accent: #7aa2f7;
    --green: #9ece6a;
    --warm: #e0af68;
    --red: #f7768e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1100px 760px at 62% 42%, #151c27 0%, #0b0e13 72%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  .app { display: flex; height: 100%; }
  aside {
    width: 322px;
    flex: none;
    padding: 22px 20px 28px;
    overflow-y: auto;
    background: rgba(18, 23, 31, .92);
    border-right: 1px solid var(--line);
    backdrop-filter: blur(10px);
  }
  h1 { font-size: 16px; margin: 0 0 6px; letter-spacing: .02em; }
  .sub { font-size: 12px; line-height: 1.65; color: var(--muted); margin: 0 0 18px; }
  .section { margin-bottom: 18px; }
  .section-title {
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  .mode {
    display: block; width: 100%; text-align: left; margin-bottom: 8px;
    padding: 10px 12px; border-radius: 10px; cursor: pointer;
    background: #11161e; border: 1px solid var(--line); color: var(--text);
    transition: border-color .15s, background .15s;
  }
  .mode:hover { border-color: #344154; }
  .mode.on {
    border-color: var(--accent); background: #17202e;
    box-shadow: inset 0 0 0 1px rgba(122, 162, 247, .22);
  }
  .mode strong { display: block; font-size: 12.5px; font-weight: 600; }
  .mode small { display: block; margin-top: 3px; font-size: 10.5px; line-height: 1.55; color: var(--muted); }
  .tag {
    display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 99px;
    background: var(--green); color: #0b0e13; font-size: 9px; font-weight: 600;
    vertical-align: 1px;
  }
  .slider { margin: 12px 0; }
  .slider .row {
    display: flex; justify-content: space-between; margin-bottom: 6px;
    font-size: 12px; color: #aab6c7;
  }
  .slider .val { color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; height: 18px; accent-color: var(--accent); cursor: pointer; }
  .actions { display: flex; gap: 8px; margin-top: 18px; }
  button.act {
    flex: 1; padding: 9px 10px; border-radius: 9px; cursor: pointer;
    background: #1a2230; border: 1px solid #2a3546; color: var(--text); font-size: 12px;
  }
  button.act:hover { border-color: #3b4b63; }
  button.act.primary { background: #22304a; border-color: #33507f; color: #cfe0ff; }
  .note {
    margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 11px; line-height: 1.75; color: var(--muted);
  }
  .stage { position: relative; flex: 1; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .hud {
    position: absolute; left: 22px; top: 20px; pointer-events: none;
    font-size: 12px; line-height: 1.6; color: #93a0b3; max-width: 480px;
  }
  .hud b { color: var(--text); font-weight: 600; }
  .legend {
    position: absolute; right: 22px; top: 20px; pointer-events: none;
    font-size: 11px; line-height: 1.9; color: #7e8a9a; text-align: right;
  }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .help {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    padding: 7px 15px; border-radius: 99px; white-space: nowrap;
    background: rgba(12, 16, 22, .74); border: 1px solid #202836;
    font-size: 12px; color: #718096; pointer-events: none;
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>图谱拖拽跟随 · 方案对比</h1>
    <p class="sub">拖动大节点把周围的小节点收拢，再拖其中一个小节点，看看邻居会不会挤在一起。</p>

    <div class="section">
      <div class="section-title">方案</div>
      <button class="mode on" data-mode="ratio">
        <strong>A · 倍率收缩</strong>
        <small>邻居按比例收向被拖节点，没有间距约束。收拢后再拖，容易叠在一起。</small>
      </button>
      <button class="mode" data-mode="ratioRepel">
        <strong>B · 收缩 + 最小间距<span class="tag">推荐</span></strong>
        <small>保留倍率收拢，但节点之间保留最小间距，挤到一起会自动弹开。改动最小。</small>
      </button>
      <button class="mode" data-mode="force">
        <strong>C · 弹簧 + 互斥<span class="tag">推荐</span></strong>
        <small>边是弹簧、节点互相排斥，接近 Obsidian 的手感；靠缩短连接长度收拢，不会叠。</small>
      </button>
      <button class="mode" data-mode="degree">
        <strong>D · 按度数区分</strong>
        <small>只有拖大节点才按倍率收拢；拖小节点保持原距离，只做最小间距约束。</small>
      </button>
    </div>

    <div class="section" id="group-ratio">
      <div class="slider">
        <div class="row"><span>相对距离</span><span class="val" id="v-ratio">55%</span></div>
        <input type="range" id="s-ratio" min="0.1" max="2" step="0.05" value="0.55" />
      </div>
    </div>

    <div class="section" id="group-gap">
      <div class="slider">
        <div class="row"><span>最小间距</span><span class="val" id="v-gap">32 px</span></div>
        <input type="range" id="s-gap" min="16" max="60" step="2" value="32" />
      </div>
    </div>

    <div class="section" id="group-force">
      <div class="slider">
        <div class="row"><span>连接长度</span><span class="val" id="v-rest">90%</span></div>
        <input type="range" id="s-rest" min="0.4" max="1.3" step="0.05" value="0.9" />
      </div>
      <div class="slider">
        <div class="row"><span>斥力</span><span class="val" id="v-repel">60%</span></div>
        <input type="range" id="s-repel" min="0" max="1.6" step="0.05" value="0.6" />
      </div>
    </div>

    <div class="actions">
      <button class="act" id="btn-reset">重置布局</button>
      <button class="act primary" id="btn-demo">一键演示</button>
    </div>

    <div class="note">
      橙色是枢纽笔记，蓝色是普通笔记。<br />
      这个原型用平面距离模拟球面上的关系，重点看“收拢后再拖小节点”时邻居的间距表现。确认方案后再改 Flutter。
    </div>
  </aside>

  <main class="stage">
    <canvas id="c"></canvas>
    <div class="hud">
      <b id="hud-title"></b><br />
      <span id="hud-desc"></span>
    </div>
    <div class="legend">
      <div><span class="dot" style="background:#e0af68"></span>大节点</div>
      <div><span class="dot" style="background:#7aa2f7"></span>小节点</div>
    </div>
    <div class="help">拖动任意节点 · 建议先拖大节点，再拖小节点</div>
  </main>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const stage = canvas.parentElement;
  const W = 1000;
  const H = 700;

  let dpr = 1;
  let viewScale = 1;
  let viewOX = 0;
  let viewOY = 0;

  const state = {
    mode: 'ratio',
    ratio: 0.55,
    gap: 32,
    rest: 0.9,
    repel: 0.6,
  };

  let nodes = [];
  let edges = [];
  let byId = {};
  let dragging = null;
  let hover = null;
  let demo = null;
  let last = performance.now();

  const MODE_INFO = {
    ratio: {
      title: '方案 A · 倍率收缩（现状思路）',
      desc: '邻居按比例收向被拖节点，没有间距约束。大节点把小节点收拢后再拖小节点，小节点会叠在一起。',
    },
    ratioRepel: {
      title: '方案 B · 收缩 + 最小间距',
      desc: '保留倍率收拢，但被拖节点的邻居之间保留最小间距，挤到一起会被弹开。',
    },
    force: {
      title: '方案 C · 弹簧 + 互斥（力导向）',
      desc: '边是弹簧、节点互相排斥，接近 Obsidian 的手感。拖动时邻居跟过来，靠缩短连接长度收拢。',
    },
    degree: {
      title: '方案 D · 按度数区分',
      desc: '拖大节点时按倍率收拢；拖小节点时保持原有距离，只保证最小间距。',
    },
  };

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  function build() {
    nodes = [];
    edges = [];
    byId = {};

    const cx = 405;
    const cy = 352;
    const hub = {
      id: 'hub', x: cx, y: cy, baseX: cx, baseY: cy,
      vx: 0, vy: 0, r: 17, hub: true,
    };
    nodes.push(hub);
    byId.hub = hub;

    const count = 9;
    for (let i = 0; i < count; i++) {
      const a = (-142 + (i * 284) / (count - 1)) * (Math.PI / 180);
      const R = 158 + (i % 2 ? 13 : 0);
      const n = {
        id: 'l' + i,
        x: cx + Math.cos(a) * R,
        y: cy + Math.sin(a) * R,
        baseX: 0, baseY: 0,
        vx: 0, vy: 0, r: 7, hub: false,
      };
      n.baseX = n.x;
      n.baseY = n.y;
      nodes.push(n);
      byId[n.id] = n;
      edges.push({ a: hub, b: n, base: dist(hub, n) });
    }

    for (let i = 0; i < count; i++) {
      const a = byId['l' + i];
      const b = byId['l' + ((i + 1) % count)];
      edges.push({ a, b, base: Math.max(1, dist(a, b)) });
    }
    for (let i = 0; i < count; i++) {
      const a = byId['l' + i];
      const b = byId['l' + ((i + 2) % count)];
      edges.push({ a, b, base: Math.max(1, dist(a, b)) });
    }
  }

  function neighborsOf(node) {
    const out = [];
    for (const e of edges) {
      if (e.a === node) out.push(e.b);
      else if (e.b === node) out.push(e.a);
    }
    return out;
  }

  function beginDrag(node, at) {
    dragging = {
      node,
      offX: node.x - at.x,
      offY: node.y - at.y,
      follow: neighborsOf(node).map((n) => {
        const dx = n.x - node.x;
        const dy = n.y - node.y;
        const d = Math.hypot(dx, dy) || 1;
        return { node: n, ux: dx / d, uy: dy / d, d0: d };
      }),
    };
  }

  function relaxGroup(group, gap, pinned) {
    for (let iter = 0; iter < 3; iter++) {
      for (let i = 0; i < group.length; i++) {
        for (let j = i + 1; j < group.length; j++) {
          const a = group[i];
          const b = group[j];
          let dx = b.x - a.x;
          let dy = b.y - a.y;
          let d = Math.hypot(dx, dy);
          if (d < 0.001) {
            dx = Math.random() - 0.5;
            dy = Math.random() - 0.5;
            d = Math.hypot(dx, dy) || 1;
          }
          if (d >= gap) continue;
          const push = gap - d;
          const ux = dx / d;
          const uy = dy / d;
          if (a === pinned) {
            b.x += ux * push;
            b.y += uy * push;
          } else if (b === pinned) {
            a.x -= ux * push;
            a.y -= uy * push;
          } else {
            a.x -= (ux * push) / 2;
            a.y -= (uy * push) / 2;
            b.x += (ux * push) / 2;
            b.y += (uy * push) / 2;
          }
        }
      }
    }
  }

  function stepFollow(dt) {
    if (!dragging) return;
    const p = dragging.node;
    const ease = 1 - Math.exp(-dt / 0.1);
    let ratio = state.ratio;
    if (state.mode === 'degree' && !p.hub) ratio = 1;
    for (const f of dragging.follow) {
      const r = f.d0 * ratio;
      const tx = p.x + f.ux * r;
      const ty = p.y + f.uy * r;
      f.node.x += (tx - f.node.x) * ease;
      f.node.y += (ty - f.node.y) * ease;
    }
    if (state.mode === 'ratioRepel' || state.mode === 'degree') {
      relaxGroup([p, ...dragging.follow.map((f) => f.node)], state.gap, p);
    }
  }

  function stepForce(dt) {
    const k = 30;
    const damp = Math.exp(-2.4 * dt);
    const cx = W / 2;
    const cy = H / 2;

    for (const n of nodes) {
      n.fx = 0;
      n.fy = 0;
    }

    for (const e of edges) {
      const a = e.a;
      const b = e.b;
      let dx = b.x - a.x;
      let dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 0.001;
      const rest = e.base * state.rest;
      const f = (d - rest) * k;
      const ux = dx / d;
      const uy = dy / d;
      a.fx += ux * f;
      a.fy += uy * f;
      b.fx -= ux * f;
      b.fy -= uy * f;
    }

    const cutoff = 96;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i];
        const b = nodes[j];
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.001;
        if (d >= cutoff) continue;
        const f = state.repel * 760 * (1 - d / cutoff);
        const ux = dx / d;
        const uy = dy / d;
        a.fx -= ux * f;
        a.fy -= uy * f;
        b.fx += ux * f;
        b.fy += uy * f;
      }
    }

    for (const n of nodes) {
      n.fx += (cx - n.x) * 0.55;
      n.fy += (cy - n.y) * 0.55;
      if (dragging && n === dragging.node) {
        n.vx = 0;
        n.vy = 0;
        continue;
      }
      n.vx = (n.vx + n.fx * dt) * damp;
      n.vy = (n.vy + n.fy * dt) * damp;
      n.x = clamp(n.x + n.vx * dt, 70, W - 70);
      n.y = clamp(n.y + n.vy * dt, 70, H - 70);
    }
  }

  function resetLayout() {
    dragging = null;
    demo = null;
    for (const n of nodes) {
      n.x = n.baseX;
      n.y = n.baseY;
      n.vx = 0;
      n.vy = 0;
    }
    if (state.mode === 'force') {
      for (let i = 0; i < 150; i++) stepForce(1 / 60);
    }
  }

  function toWorld(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left - viewOX) / viewScale,
      y: (e.clientY - r.top - viewOY) / viewScale,
    };
  }

  function hit(p) {
    let best = null;
    let bestD = Infinity;
    for (const n of nodes) {
      const d = Math.hypot(n.x - p.x, n.y - p.y);
      if (d <= n.r + 10 && d < bestD) {
        best = n;
        bestD = d;
      }
    }
    return best;
  }

  function resize() {
    const r = canvas.getBoundingClientRect();
    dpr = clamp(window.devicePixelRatio || 1, 1, 2);
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    viewScale = Math.min(r.width / W, r.height / H);
    viewOX = (r.width - W * viewScale) / 2;
    viewOY = (r.height - H * viewScale) / 2;
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
    ctx.save();
    ctx.translate(viewOX, viewOY);
    ctx.scale(viewScale, viewScale);

    if (dragging && (state.mode === 'ratioRepel' || state.mode === 'force')) {
      ctx.beginPath();
      ctx.arc(dragging.node.x, dragging.node.y, state.gap, 0, Math.PI * 2);
      ctx.setLineDash([4, 6]);
      ctx.strokeStyle = 'rgba(122,162,247,.22)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.setLineDash([]);
    }

    for (const e of edges) {
      const active = dragging && (e.a === dragging.node || e.b === dragging.node);
      ctx.beginPath();
      ctx.moveTo(e.a.x, e.a.y);
      ctx.lineTo(e.b.x, e.b.y);
      ctx.strokeStyle = active ? 'rgba(122,162,247,.42)' : 'rgba(118,136,164,.16)';
      ctx.lineWidth = active ? 1.4 : 1;
      ctx.stroke();
    }

    for (const n of nodes) {
      const color = n.hub ? '#e0af68' : '#7aa2f7';
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = n.hub ? 22 : 11;
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.beginPath();
      ctx.arc(n.x - n.r * 0.28, n.y - n.r * 0.28, n.r * 0.32, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,.72)';
      ctx.fill();

      if (n === hover || (dragging && n === dragging.node)) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r + 6, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,.5)';
        ctx.lineWidth = 1.3;
        ctx.stroke();
      }
    }

    const hub = byId.hub;
    if (hub) {
      ctx.fillStyle = 'rgba(224,175,104,.75)';
      ctx.font = '11px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('大节点', hub.x, hub.y + hub.r + 16);
    }
    const leaf = byId.l4;
    if (leaf) {
      ctx.fillStyle = 'rgba(122,162,247,.7)';
      ctx.font = '11px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('小节点', leaf.x, leaf.y + leaf.r + 16);
    }

    ctx.restore();
  }

  function updateDemo(dt) {
    if (!demo) return;
    if (demo.phase === 'wait') {
      demo.t += dt;
      if (demo.t >= demo.wait) startDemoLeaf();
      return;
    }
    demo.t += dt;
    const u = clamp(demo.t / demo.dur, 0, 1);
    const e = u * u * (3 - 2 * u);
    const n = demo.node;
    n.x = demo.fx + (demo.tx - demo.fx) * e;
    n.y = demo.fy + (demo.ty - demo.fy) * e;
    if (state.mode === 'force') {
      n.vx = 0;
      n.vy = 0;
    }
    if (u >= 1) {
      dragging = null;
      if (demo.phase === 1) {
        demo = { phase: 'wait', t: 0, wait: 0.35 };
      } else {
        demo = null;
      }
    }
  }

  function startDemoLeaf() {
    const leaf = byId.l4;
    beginDrag(leaf, { x: leaf.x, y: leaf.y });
    demo = {
      phase: 2,
      t: 0,
      dur: 0.9,
      node: leaf,
      fx: leaf.x,
      fy: leaf.y,
      tx: leaf.x + 92,
      ty: leaf.y + 66,
    };
  }

  function runDemo() {
    resetLayout();
    const hub = byId.hub;
    beginDrag(hub, { x: hub.x, y: hub.y });
    demo = {
      phase: 1,
      t: 0,
      dur: 0.9,
      node: hub,
      fx: hub.x,
      fy: hub.y,
      tx: hub.x + 128,
      ty: hub.y - 78,
    };
  }

  function updateModeUI() {
    document.querySelectorAll('.mode').forEach((b) => {
      b.classList.toggle('on', b.dataset.mode === state.mode);
    });
    const info = MODE_INFO[state.mode];
    document.getElementById('hud-title').textContent = info.title;
    document.getElementById('hud-desc').textContent = info.desc;

    const showRatio = state.mode === 'ratio' || state.mode === 'ratioRepel' || state.mode === 'degree';
    const showGap = state.mode === 'ratioRepel' || state.mode === 'degree';
    const showForce = state.mode === 'force';
    document.getElementById('group-ratio').style.display = showRatio ? '' : 'none';
    document.getElementById('group-gap').style.display = showGap ? '' : 'none';
    document.getElementById('group-force').style.display = showForce ? '' : 'none';
  }

  document.querySelectorAll('.mode').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.mode = btn.dataset.mode;
      updateModeUI();
      resetLayout();
    });
  });

  document.getElementById('s-ratio').addEventListener('input', (e) => {
    state.ratio = Number(e.target.value);
    document.getElementById('v-ratio').textContent = Math.round(state.ratio * 100) + '%';
  });
  document.getElementById('s-gap').addEventListener('input', (e) => {
    state.gap = Number(e.target.value);
    document.getElementById('v-gap').textContent = state.gap + ' px';
  });
  document.getElementById('s-rest').addEventListener('input', (e) => {
    state.rest = Number(e.target.value);
    document.getElementById('v-rest').textContent = Math.round(state.rest * 100) + '%';
  });
  document.getElementById('s-repel').addEventListener('input', (e) => {
    state.repel = Number(e.target.value);
    document.getElementById('v-repel').textContent = Math.round(state.repel * 100) + '%';
  });

  document.getElementById('btn-reset').addEventListener('click', resetLayout);
  document.getElementById('btn-demo').addEventListener('click', runDemo);

  canvas.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    const p = toWorld(e);
    const n = hit(p);
    if (!n) return;
    demo = null;
    beginDrag(n, p);
    canvas.setPointerCapture(e.pointerId);
    canvas.style.cursor = 'grabbing';
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', (e) => {
    const p = toWorld(e);
    hover = dragging ? null : hit(p);
    if (!dragging) {
      canvas.style.cursor = hover ? 'grab' : 'default';
      return;
    }
    dragging.node.x = p.x + dragging.offX;
    dragging.node.y = p.y + dragging.offY;
    if (state.mode === 'force') {
      dragging.node.vx = 0;
      dragging.node.vy = 0;
    }
  });

  canvas.addEventListener('pointerup', () => {
    dragging = null;
    canvas.style.cursor = 'default';
  });
  canvas.addEventListener('pointercancel', () => {
    dragging = null;
  });
  canvas.addEventListener('pointerleave', () => {
    hover = null;
  });

  function frame(now) {
    const dt = Math.min(0.033, Math.max(0.001, (now - last) / 1000));
    last = now;
    if (demo) updateDemo(dt);
    if (state.mode === 'force') stepForce(dt);
    else stepFollow(dt);
    draw();
    requestAnimationFrame(frame);
  }

  build();
  resize();
  updateModeUI();
  new ResizeObserver(resize).observe(stage);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
