<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图谱观感方案 · 四选一</title>
<style>
  :root {
    --bg: #0B0B0D;
    --bar: #141416;
    --line: #26262B;
    --text: #E7E8EC;
    --dim: #8A8D96;
    --faint: #5E6169;
    --accent: #7FC4F0;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #app { display: flex; flex-direction: column; height: 100%; }

  /* ---------- 顶栏 ---------- */
  header {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 18px;
    padding: 0 16px; height: 52px;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    user-select: none;
  }
  .brand { font-size: 13px; font-weight: 600; letter-spacing: .2px; white-space: nowrap; }
  .brand em { font-style: normal; color: var(--faint); font-weight: 400; margin-left: 8px; font-size: 12px; }

  nav { display: flex; gap: 4px; flex: 1 1 auto; overflow: hidden; }
  nav button {
    appearance: none; border: 1px solid transparent; background: transparent;
    color: var(--dim); font: inherit; font-size: 12.5px;
    padding: 6px 12px; border-radius: 7px; cursor: pointer;
    white-space: nowrap; display: flex; align-items: center; gap: 7px;
    transition: background .14s, color .14s, border-color .14s;
  }
  nav button:hover { background: #1D1D21; color: var(--text); }
  nav button[aria-selected="true"] {
    background: #22242A; color: #fff; border-color: #34363E;
  }
  nav button .k {
    font: 10px/1 var(--mono); color: var(--faint);
    border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px;
  }
  nav button[aria-selected="true"] .k { color: var(--dim); border-color: #3C3E47; }

  .tools { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .tools button {
    appearance: none; border: 1px solid var(--line); background: #1A1A1E;
    color: var(--dim); font: inherit; font-size: 12px;
    padding: 5px 10px; border-radius: 6px; cursor: pointer;
    transition: color .14s, border-color .14s, background .14s;
  }
  .tools button:hover { color: var(--text); border-color: #3A3C44; }
  .tools button[aria-pressed="true"] { color: var(--text); border-color: #3F424B; background: #22242A; }

  /* ---------- 画布 ---------- */
  main { position: relative; flex: 1 1 auto; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  canvas.pointing { cursor: pointer; }

  /* ---------- 说明卡 ---------- */
  #card {
    position: absolute; left: 16px; top: 16px;
    width: 316px; padding: 13px 14px 12px;
    background: rgba(20, 20, 23, .82);
    backdrop-filter: blur(14px) saturate(1.2);
    border: 1px solid #2A2C33; border-radius: 11px;
    box-shadow: 0 14px 40px rgba(0,0,0,.5);
    pointer-events: none;

  #card h2 {
    margin: 0 0 3px; font-size: 14px; font-weight: 650; letter-spacing: .2px;
    display: flex; align-items: center; gap: 8px;
  }
  #card h2 .tag {
    font: 10px/1 var(--mono); color: #0B0B0D; background: var(--accent);

  #card dl { margin: 0; display: grid; grid-template-columns: 54px 1fr; gap: 5px 8px; }
  #card dt { color: var(--faint); font-size: 11px; padding-top: 1px; }
  #card dd { margin: 0; color: #A8ABB4; font-size: 12px; }
  #card dd b { color: #D9DBE1; font-weight: 600; }

  /* ---------- 图例 / 提示 ---------- */
  #legend {
    position: absolute; left: 16px; bottom: 16px;
    display: flex; gap: 12px; align-items: center;
    padding: 7px 11px; border-radius: 9px;
    background: rgba(20,20,23,.78); border: 1px solid #262830;
    backdrop-filter: blur(10px);
    font-size: 11.5px; color: var(--dim);

    position: absolute; right: 16px; bottom: 16px;
    font-size: 11.5px; color: var(--faint); pointer-events: none;
    font-family: var(--mono); letter-spacing: .2px;
  }
  #toast {
    position: absolute; left: 50%; bottom: 64px; transform: translate(-50%, 8px);
    background: rgba(32,34,40,.95); border: 1px solid #3A3C44;
    color: #E7E8EC; font-size: 12px; padding: 7px 13px; border-radius: 8px;
    opacity: 0; transition: opacity .18s, transform .18s; pointer-events: none;
    white-space: nowrap;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>

<body>

</div>

<script>
/* ==================================================================
   数据 + 物理 —— 和 design/graph-view-mock.html 同一套常数，
   所以四个方案之间比的是「观感」，不是「布局算法」。
   ================================================================== */

const FOLDERS = {
  '':     { name: '根目录', color: '#C2C5CC' },
  '日记': { name: '日记',   color: '#F2C35C' },
  '项目': { name: '项目',   color: '#7FC4F0' },

};

const NOTES = [
  { t: '索引',        f: '',     links: ['开发进度', '快速入门', '待办', 'NRS 重构', '排版笔记', '双链的用法'] },
  { t: '开发进度',    f: '',     links: ['NRS 重构', '数据安全', '表格功能', '图谱功能', '发布计划', '10月25日'] },
  { t: '快速入门',    f: '',     links: ['待办', '双链的用法'] },
  { t: '待办',        f: '',     links: ['发布计划', '开发进度'] },

  { t: '10月25日',    f: '日记', links: ['10月24日', '开发进度', '图谱功能'] },
  { t: '10月24日',    f: '日记', links: ['10月23日', '开发进度'] },
  { t: '10月23日',    f: '日记', links: ['10月22日', '每日日记'] },
  { t: '10月22日',    f: '日记', links: ['每日日记'] },
  { t: '每日日记',    f: '日记', links: ['10月25日', '待办'] },

  { t: 'NRS 重构',    f: '项目', links: ['数据安全', '表格功能', '图谱功能', '离线优先', '界面密度', '发布计划'] },
  { t: '数据安全',    f: '项目', links: ['离线优先', '发布计划'] },
  { t: '表格功能',    f: '项目', links: ['排版笔记', '界面密度'] },
  { t: '图谱功能',    f: '项目', links: ['力导向布局', '双链的用法', '排版笔记', '10月25日'] },
  { t: '发布计划',    f: '项目', links: ['待办', '会议记录'] },
  { t: '会议记录',    f: '项目', links: ['待办', '发布计划'] },

  { t: 'Rust 所有权', f: '学习', links: ['分布式共识'] },
  { t: '力导向布局',  f: '学习', links: ['排版笔记'] },
  { t: '排版笔记',    f: '学习', links: ['界面密度', '读书笔记'] },
  { t: '分布式共识',  f: '学习', links: ['Rust 所有权', '排版笔记'] },
  { t: '读书笔记',    f: '学习', links: ['排版笔记', 'Rust 所有权'] },
  { t: '待读清单',    f: '学习', links: [] },

  { t: '冷启动',      f: '灵感', links: ['离线优先', '界面密度'] },
  { t: '离线优先',    f: '灵感', links: ['分布式共识', '数据安全'] },
  { t: '界面密度',    f: '灵感', links: ['排版笔记', '冷启动'] },
  { t: '双链的用法',  f: '灵感', links: ['快速入门', '索引'] },
  { t: '随手记',      f: '灵感', links: [] },
];

const PHYS = { rep: 9200, spring: 0.021, rest: 74, grav: 0.0125, damp: 0.80, vmax: 14 };

function buildGraph(notes) {
  const byTitle = new Map(notes.map(n => [n.t, n]));
  notes.forEach(n => { n.out = 0; n.in = 0; n.deg = 0; n.neigh = new Set(); n.vx = 0; n.vy = 0; });
  const byKey = new Map(), links = [];
  for (const n of notes) {
    for (const t of (n.links || [])) {
      const m = byTitle.get(t);
      if (!m || m === n) continue;
      n.out++; m.in++;
      const k = n.t < m.t ? n.t + '\u0000' + m.t : m.t + '\u0000' + n.t;
      const hit = byKey.get(k);
      if (hit) { hit.ba = true; continue; }        // 互相 [[链接]] 只画一条线
      const link = { a: n, b: m, ab: true, ba: false };
      byKey.set(k, link);
      links.push(link);
      n.deg++; m.deg++;
      n.neigh.add(m.t); m.neigh.add(n.t);
    }
  }
  return { nodes: notes, links, byTitle };
}

function radiusOf(deg, scale) { return (3.4 + Math.sqrt(deg) * 1.85) * scale; }

function step(g, alpha) {
  const P = PHYS, nodes = g.nodes;
  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    for (let j = i + 1; j < nodes.length; j++) {
      const b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 0.01) { dx = (i - j) * 0.01 + 0.01; dy = 0.01; d2 = 0.01; }
      const d = Math.sqrt(d2), f = P.rep / d2 * alpha, ux = dx / d, uy = dy / d;
      a.vx -= ux * f; a.vy -= uy * f;
      b.vx += ux * f; b.vy += uy * f;
    }
  }
  for (const l of g.links) {
    const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y;
    const d = Math.hypot(dx, dy) || 1;
    const f = (d - P.rest) * P.spring * alpha, ux = dx / d, uy = dy / d;
    l.a.vx += ux * f; l.a.vy += uy * f;
    l.b.vx -= ux * f; l.b.vy -= uy * f;
  }
  for (const n of nodes) {
    if (n.pin) { n.vx = 0; n.vy = 0; continue; }
    n.vx -= n.x * P.grav * alpha;
    n.vy -= n.y * P.grav * alpha;
    n.vx *= P.damp; n.vy *= P.damp;
    const sp = Math.hypot(n.vx, n.vy);
    if (sp > P.vmax) { n.vx *= P.vmax / sp; n.vy *= P.vmax / sp; }
    n.x += n.vx; n.y += n.vy;
  }
}

function seed(g, radius) {
  const n = g.nodes.length;
  g.nodes.forEach((node, i) => {
    const a = (i / n) * Math.PI * 2 + (i % 3) * 0.4;
    const r = radius * (0.55 + ((i * 37) % 45) / 100);
    node.x = Math.cos(a) * r;
    node.y = Math.sin(a) * r;
    node.vx = 0; node.vy = 0;
  });
}

function settle(g, ticks) { for (let i = 0; i < ticks; i++) step(g, 1); }

function bounds(g) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of g.nodes) {
    const r = n.r || 6;
    if (n.x - r < x0) x0 = n.x - r;
    if (n.y - r < y0) y0 = n.y - r;
    if (n.x + r > x1) x1 = n.x + r;
    if (n.y + r > y1) y1 = n.y + r;
  }
  return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
}

/* ==================================================================
   四个方案的定义。每个方案只声明「观感 + 动效」，
   布局、命中、拖拽这些共用下面那一套。
   ================================================================== */

const TAU = Math.PI * 2;

const VARIANTS = {
  breathe: {
    name: '呼吸',
    tag: '最接近 Obsidian',
    lede: '布局永不停机。节点之间留一点残余力，整张图像有呼吸一样缓慢游动，永远不是一张死图。',
    motion: '布局本身在动',
    changes: [
      '节点实心圆 + <b>彩色外发光</b>（shadowBlur 随相位脉动 9→16）',
      '连线是<b>直线</b>，常态只有 7% 白，邻居亮到 34%，焦点 62%',
      '悬停节点放大 1.18 倍、光晕加倍、标签淡入',
      '选中节点时相机<b>缓动居中</b>（1.1s ease-out）',
      '每个节点叠 ±0.8px 的慢速正弦漂移（周期 9s，相位错开）',
    ],
    cost: 'ticker 永不停止（约 0.4% CPU）；漂移量要按库大小调，太大会晕',
    floor: 0.020,
    drift: 0.85,
    driftPeriod: 9000,
    labels: 'hover',
  },

  nebula: {
    name: '星云',
    tag: '最炫',
    lede: '节点是一团光，不是一颗点。叠加发光 + 星尘背景 + 选中时邻居按层级依次点亮。',
    motion: '光在动',
    changes: [
      '节点用 <b>lighter 叠加</b>：三层径向渐变 + 白芯，直径约半径 4 倍',
      '连线是<b>两端渐变</b>的描边（从 A 的颜色渐到 B 的颜色）',
      '背景 140 颗星尘，各自不同周期闪烁；两团星云极慢漂移',
      '选中后按 <b>BFS 层级错开 90ms</b> 依次亮起，像星座连线',
      '拖动节点时拖出一串<b>逐渐变淡的残影</b>，松手后逐帧退场',
    ],
    cost: '每帧为每条边新建渐变对象，节点上千要缓存；叠加发光在低端机上比普通绘制贵',
    floor: 0.022,
    drift: 0.45,
    driftPeriod: 11000,
    labels: 'hover',
  },

  glass: {
    name: '玻璃',
    tag: '最克制',
    lede: '不呼吸。图是静止的，只有你碰它的时候才有 180ms 的弹性反馈。像 Linear 那种仪表盘。',
    motion: '反馈在动',
    changes: [
      '节点是<b>玻璃圆片</b>：上亮下暗的线性渐变 + 1px 内描边 + 高光椭圆 + 下方柔影',
      '分组色只体现在<b>细描边</b>上，节点本体是中性灰',
      '连线 0.9px 圆头；选中时整条链路换成强调色 <b>#7FC4F0</b>',
      '标签常显（10px / 42% 白），悬停才放大到 11.5px / 95%',
      '所有过渡都是 <b>ease-out 180ms</b>，没有常驻动画',
    ],
    cost: '最省电（静止时 0 帧）；但「没有生命感」，大库时看着像静态图',
    floor: 0,
    drift: 0,
    driftPeriod: 0,
    labels: 'always',
  },

  ink: {
    name: '墨线',
    tag: '最能表达双链',
    lede: '动的是信息本身：连线有轻微弧度，选中后出链跑流动虚线，一眼看出「谁指向谁」。',
    motion: '信息在动',
    changes: [
      '连线是<b>二次贝塞尔</b>，每条边固定的垂直偏移（±6px，由标题哈希决定），不会来回抖',
      '选中节点后，它<b>单向</b>的出链上跑<b>流动的墨点</b>，一眼看出「谁指向谁」',
      '互相链接的边是双向的，不画墨点（不撒谎）',
      '节点是<b>实心墨点</b>，不发光、不做渐变，边界干净',
      '选中时扩散三圈<b>水墨涟漪</b>（间隔 140ms）',
      '整体有极轻的 0.3px 漂移，像纸在桌上被风吹',
    ],
    cost: '曲线要算控制点；流动虚线在低端机上可能掉帧，可以只在选中时开',
    floor: 0.014,
    drift: 0.30,
    driftPeriod: 13000,
    labels: 'hover',
  },
};

const ORDER = ['breathe', 'nebula', 'glass', 'ink'];

/* ==================================================================
   状态
   ================================================================== */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

const G = buildGraph(NOTES.map(n => ({ ...n })));
G.nodes.forEach((n, i) => { n.i = i; n.color = (FOLDERS[n.f] || FOLDERS['']).color; n.r = radiusOf(n.deg, 1); });

seed(G, 260);
settle(G, 700);

let variant = 'breathe';
let alpha = 0.55;
let view = { s: 1, x: 0, y: 0 };
let cam = null;                     // {s,x,y,t0,dur} 相机缓动
let hover = null;
let sel = null;
let selTime = 0;
let selDepth = new Map();
let showLabels = true;
let paused = false;
let ripples = [];
let trail = [];                      // 星云方案：拖动时被拖节点的残影
let dpr = 1, W = 0, H = 0;

/* ---------------- 视口 ---------------- */

function fit(pad = 74) {
  const b = bounds(G);
  const s = Math.min((W - pad * 2) / Math.max(b.w, 1), (H - pad * 2) / Math.max(b.h, 1));
  const scale = Math.max(0.2, Math.min(1.5, s));
  view = {
    s: scale,
    x: W / 2 - ((b.x0 + b.x1) / 2) * scale,
    y: H / 2 - ((b.y0 + b.y1) / 2) * scale,
  };
  cam = null;
}

function zoomAt(sx, sy, factor) {
  const next = Math.max(0.22, Math.min(3.2, view.s * factor));
  const k = next / view.s;
  view.x = sx - (sx - view.x) * k;
  view.y = sy - (sy - view.y) * k;
  view.s = next;
  cam = null;
}

function toWorld(sx, sy) { return { x: (sx - view.x) / view.s, y: (sy - view.y) / view.s }; }

function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

function centerOn(node) {
  const target = { s: Math.max(view.s, 1.05), x: 0, y: 0 };
  target.x = W / 2 - node.x * target.s;
  target.y = H / 2 - node.y * target.s;
  cam = { from: { ...view }, to: target, t0: performance.now(), dur: 1100 };
}

/* ---------------- 命中 ---------------- */

function nodeAt(sx, sy) {
  const w = toWorld(sx, sy);
  let best = null, bestD = Infinity;
  for (const n of G.nodes) {
    const d = Math.hypot(n.x - w.x, n.y - w.y);
    if (d <= n.r + 8 / view.s && d < bestD) { bestD = d; best = n; }
  }
  return best;
}

/* ---------------- 选中 / 层级 ---------------- */

function setSel(node) {
  sel = node;
  selTime = performance.now();
  selDepth = new Map();
  ripples = [];
  if (!node) return;
  selDepth.set(node.t, 0);
  const q = [node];
  while (q.length) {
    const cur = q.shift();
    const d = selDepth.get(cur.t);
    for (const n of G.nodes) {
      if (!cur.neigh.has(n.t) || selDepth.has(n.t)) continue;
      selDepth.set(n.t, d + 1);
      q.push(n);
    }
  }
  if (variant === 'ink') {
    for (let k = 0; k < 3; k++) ripples.push({ x: node.x, y: node.y, t0: performance.now() + k * 140, color: node.color });
  }
}

function focusNode() { return hover || sel; }

function nodeLit(n) {
  const f = focusNode();
  if (!f) return true;
  return n === f || f.neigh.has(n.t);
}

/** 0 普通 / 1 亮 / 2 焦点 / 3 淡 */
function edgeState(l) {
  const f = focusNode();
  if (!f) return 0;
  if (l.a === f || l.b === f) return 2;
  if (f.neigh.has(l.a.t) && f.neigh.has(l.b.t)) return 1;
  return 3;
}

/* ==================================================================
   绘制 —— 公共小工具
   ================================================================== */

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }

function label(text, x, y, size, alpha, halo) {
  if (alpha <= 0.01) return;
  ctx.font = `500 ${size}px -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 3;
  ctx.strokeStyle = halo;
  ctx.globalAlpha = alpha;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = '#DCDEE4';
  ctx.fillText(text, x, y);
  ctx.globalAlpha = 1;
}

/** 每个节点的慢速漂移：物理之外的「生命感」，不会破坏布局。 */
function driftOf(n, now, amp, period) {
  if (!amp) return { dx: 0, dy: 0 };
  const w = TAU / period;
  return {
    dx: Math.sin(now * w + n.i * 1.7) * amp,
    dy: Math.cos(now * w * 0.83 + n.i * 2.3) * amp,
  };
}

/** 当前节点在屏幕上的位置（含漂移）。绘制和命中都用它。 */
function posOf(n, now, v) {
  const d = driftOf(n, now, v.drift, v.driftPeriod);
  return { x: n.x + d.dx, y: n.y + d.dy };
}

/* ==================================================================
   方案 A · 呼吸
   ================================================================== */

function bgBreathe(now) {
  const g = ctx.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.45, Math.max(W, H) * 0.75);
  g.addColorStop(0, '#25252A');
  g.addColorStop(0.55, '#191A1E');
  g.addColorStop(1, '#0B0B0D');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawBreathe(now) {
  const v = VARIANTS.breathe;
  bgBreathe(now);

  // 连线
  ctx.lineCap = 'round';
  const groups = [[], [], [], []];
  for (const l of G.links) groups[edgeState(l)].push(l);
  const styles = [
    ['rgba(231,232,236,0.075)', 1],
    ['rgba(231,232,236,0.34)', 1.15],
    ['rgba(231,232,236,0.62)', 1.5],
    ['rgba(231,232,236,0.020)', 1],
  ];
  for (let s = 0; s < 4; s++) {
    if (!groups[s].length) continue;
    ctx.strokeStyle = styles[s][0];
    ctx.lineWidth = styles[s][1];
    ctx.beginPath();
    for (const l of groups[s]) {
      const a = posOf(l.a, now, v), b = posOf(l.b, now, v);
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
    }
    ctx.stroke();
  }

  // 节点
  for (const n of G.nodes) {
    const p = posOf(n, now, v);
    const lit = nodeLit(n);
    const isFocus = n === focusNode();
    const r = n.r * (isFocus ? 1.18 : 1);
    const pulse = 0.5 + 0.5 * Math.sin(now * 0.0011 + n.i * 1.3);
    ctx.globalAlpha = lit ? 1 : 0.18;
    ctx.shadowColor = hexA(n.color, lit ? 0.9 : 0.4);
    ctx.shadowBlur = (9 + 7 * pulse) * (isFocus ? 2.1 : 1);
    ctx.fillStyle = n.color;
    circle(p.x, p.y, r);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;

    if (n === sel) {
      ctx.strokeStyle = hexA(n.color, 0.85);
      ctx.lineWidth = 1.6;
      circle(p.x, p.y, r + 5.5);
      ctx.stroke();
    }
  }

  // 标签
  for (const n of G.nodes) {
    const isFocus = n === focusNode();
    const show = showLabels && (v.labels === 'always' || isFocus);
    if (!show) continue;
    const p = posOf(n, now, v);
    label(n.t, p.x, p.y + n.r + 13, isFocus ? 11.5 : 10.5, isFocus ? 0.95 : 0.5, 'rgba(12,12,14,0.92)');
  }
}

/* ==================================================================
   方案 B · 星云
   ================================================================== */

const STARS = Array.from({ length: 140 }, (_, i) => ({
  x: ((i * 733) % 1000) / 1000,
  y: ((i * 431) % 1000) / 1000,
  r: 0.4 + ((i * 17) % 12) / 12,
  ph: (i * 0.7) % TAU,
  sp: 0.0006 + ((i * 13) % 9) / 12000,
}));

function bgNebula(now) {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#0A0A0F');
  g.addColorStop(1, '#050509');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 两团极慢漂移的星云
  const blobs = [
    { x: W * (0.32 + 0.05 * Math.sin(now * 0.00008)), y: H * (0.35 + 0.04 * Math.cos(now * 0.00007)), c: 'rgba(127,196,240,0.055)', r: Math.max(W, H) * 0.55 },
    { x: W * (0.7 + 0.04 * Math.cos(now * 0.00006)), y: H * (0.62 + 0.05 * Math.sin(now * 0.00009)), c: 'rgba(195,166,237,0.05)', r: Math.max(W, H) * 0.5 },
  ];
  for (const b of blobs) {
    const rg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    rg.addColorStop(0, b.c);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);
  }

  // 星尘
  ctx.globalCompositeOperation = 'lighter';
  for (const s of STARS) {
    const tw = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(now * s.sp + s.ph));
    ctx.fillStyle = `rgba(255,255,255,${0.05 + 0.16 * tw})`;
    circle(s.x * W, s.y * H, s.r * (0.7 + 0.5 * tw));
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawNebula(now) {
  const v = VARIANTS.nebula;
  bgNebula(now);

  // 连线：两端渐变
  ctx.lineCap = 'round';
  for (const l of G.links) {
    const st = edgeState(l);
    const a = posOf(l.a, now, v), b = posOf(l.b, now, v);
    const alphaMap = [0.10, 0.55, 0.95, 0.022];
    const widthMap = [0.9, 1.3, 1.9, 0.9];
    const grad = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
    grad.addColorStop(0, hexA(l.a.color, alphaMap[st]));
    grad.addColorStop(1, hexA(l.b.color, alphaMap[st]));
    ctx.strokeStyle = grad;
    ctx.lineWidth = widthMap[st];
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  // 节点：叠加发光
  ctx.globalCompositeOperation = 'lighter';

  // 拖动残影：只画被拖的那个节点，位置来自 trail，越旧越淡
  if (trail.length) {
    for (let i = 0; i < trail.length; i++) {
      const g0 = trail[i];
      const k = i / trail.length;
      const gr = g0.r * 3.4;
      const gg = ctx.createRadialGradient(g0.x, g0.y, 0, g0.x, g0.y, gr);
      gg.addColorStop(0, hexA(g0.color, 0.20 * k));
      gg.addColorStop(1, hexA(g0.color, 0));
      ctx.fillStyle = gg;
      circle(g0.x, g0.y, gr);
      ctx.fill();
    }
  }

  for (const n of G.nodes) {
    const p = posOf(n, now, v);
    const isFocus = n === focusNode();
    // 选中后按层级错开点亮
    let appear = 1;
    if (sel) {
      const d = selDepth.has(n.t) ? selDepth.get(n.t) : 9;
      appear = Math.max(0, Math.min(1, (now - selTime - d * 90) / 260));
      if (appear <= 0) appear = 0.06;
    }
    const r = n.r * (isFocus ? 1.25 : 1);
    const glow = r * (isFocus ? 5.4 : 4.2);
    const g1 = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glow);
    g1.addColorStop(0, hexA(n.color, 0.95 * appear));
    g1.addColorStop(0.18, hexA(n.color, 0.42 * appear));
    g1.addColorStop(0.55, hexA(n.color, 0.10 * appear));
    g1.addColorStop(1, hexA(n.color, 0));
    ctx.fillStyle = g1;
    circle(p.x, p.y, glow);
    ctx.fill();

    ctx.fillStyle = `rgba(255,255,255,${0.92 * appear})`;
    circle(p.x, p.y, r * 0.62);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  // 选中环
  if (sel) {
    const p = posOf(sel, now, v);
    const t = Math.min(1, (now - selTime) / 620);
    ctx.strokeStyle = hexA(sel.color, 0.55 * (1 - t) + 0.2);
    ctx.lineWidth = 1.2;
    circle(p.x, p.y, sel.r + 4 + t * 16);
    ctx.stroke();
  }

  for (const n of G.nodes) {
    const isFocus = n === focusNode();
    const show = showLabels && (v.labels === 'always' || isFocus);
    if (!show) continue;
    const p = posOf(n, now, v);
    label(n.t, p.x, p.y + n.r * 4.2 + 9, isFocus ? 11.5 : 10.5, isFocus ? 0.95 : 0.45, 'rgba(6,6,10,0.9)');
  }
}

/* ==================================================================
   方案 C · 玻璃
   ================================================================== */

function bgGlass(now) {
  ctx.fillStyle = '#191A1D';
  ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W * 0.28, H * 0.16, 0, W * 0.28, H * 0.16, Math.max(W, H) * 0.9);
  g.addColorStop(0, 'rgba(255,255,255,0.055)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.34)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

function drawGlass(now) {
  const v = VARIANTS.glass;
  bgGlass(now);

  // 连线
  ctx.lineCap = 'round';
  const groups = [[], [], [], []];
  for (const l of G.links) groups[edgeState(l)].push(l);
  const styles = [
    ['rgba(255,255,255,0.10)', 0.9],
    ['rgba(255,255,255,0.30)', 1.0],
    ['#7FC4F0', 1.4],
    ['rgba(255,255,255,0.028)', 0.9],
  ];
  for (let s = 0; s < 4; s++) {
    if (!groups[s].length) continue;
    ctx.strokeStyle = styles[s][0];
    ctx.lineWidth = styles[s][1];
    ctx.beginPath();
    for (const l of groups[s]) {
      const a = posOf(l.a, now, v), b = posOf(l.b, now, v);
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
    }
    ctx.stroke();
  }

  // 节点：玻璃片
  for (const n of G.nodes) {
    const p = posOf(n, now, v);
    const lit = nodeLit(n);
    const isFocus = n === focusNode();
    const r = n.r * (isFocus ? 1.2 : 1);
    ctx.globalAlpha = lit ? 1 : 0.22;

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.55)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 2.5;
    const fill = ctx.createLinearGradient(p.x, p.y - r, p.x, p.y + r);
    fill.addColorStop(0, '#43464E');
    fill.addColorStop(1, '#1C1D21');
    ctx.fillStyle = fill;
    circle(p.x, p.y, r);
    ctx.fill();
    ctx.restore();

    // 高光
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath();
    ctx.ellipse(p.x - r * 0.22, p.y - r * 0.34, r * 0.52, r * 0.33, -0.5, 0, TAU);
    ctx.fill();

    // 分组色只在描边上
    ctx.strokeStyle = hexA(n.color, isFocus ? 1 : 0.8);
    ctx.lineWidth = isFocus ? 1.8 : 1.3;
    circle(p.x, p.y, r + 0.6);
    ctx.stroke();

    ctx.globalAlpha = 1;

    if (n === sel) {
      ctx.strokeStyle = 'rgba(127,196,240,0.85)';
      ctx.lineWidth = 1.5;
      circle(p.x, p.y, r + 5);
      ctx.stroke();
    }
  }

  // 标签：常显
  for (const n of G.nodes) {
    const isFocus = n === focusNode();
    if (!showLabels) continue;
    const p = posOf(n, now, v);
    label(n.t, p.x, p.y + n.r + 13, isFocus ? 11.5 : 10, isFocus ? 0.95 : 0.42, 'rgba(25,26,29,0.95)');
  }
}

/* ==================================================================
   方案 D · 墨线
   ================================================================== */

function edgeOffset(l) {
  // 稳定的垂直偏移：由两个标题的字符和决定，不摇随机数。
  const s = l.a.t + l.b.t;
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) & 0xffff;
  return ((h % 25) / 25 - 0.5) * 13;   // -6.5 .. +6.5
}

function bgInk(now) {
  const g = ctx.createRadialGradient(W * 0.5, H * 0.42, 0, W * 0.5, H * 0.42, Math.max(W, H) * 0.8);
  g.addColorStop(0, '#1B191F');
  g.addColorStop(1, '#0E0D11');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawInk(now) {
  const v = VARIANTS.ink;
  bgInk(now);

  const f = focusNode();

  // 涟漪（画在连线下面）
  for (const rp of ripples) {
    const t = (now - rp.t0) / 900;
    if (t < 0 || t > 1) continue;
    ctx.strokeStyle = hexA(rp.color, 0.45 * (1 - t));
    ctx.lineWidth = 1.2;
    circle(rp.x, rp.y, 6 + t * 46);
    ctx.stroke();
  }

  // 连线：曲线
  ctx.lineCap = 'round';
  for (const l of G.links) {
    const st = edgeState(l);
    const a = posOf(l.a, now, v), b = posOf(l.b, now, v);
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1;
    const off = edgeOffset(l);
    // 控制点只由 (a,b) 的固定顺序算出：反过来走同一条曲线，形状不变。
    const cp = { x: mx + (-dy / d) * off * 2, y: my + (dx / d) * off * 2 };

    const alphaMap = [0.10, 0.40, 0.72, 0.025];
    const widthMap = [1, 1.2, 1.6, 1];
    ctx.strokeStyle = hexA(st === 2 ? l.a.color : '#DCDEE4', alphaMap[st]);
    ctx.lineWidth = widthMap[st];
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.quadraticCurveTo(cp.x, cp.y, b.x, b.y);
    ctx.stroke();

    // 只有单向的边才有「流向」；互相链接的边是双向的，不画墨点。
    if (st === 2 && f && l.ab !== l.ba) {
      const from = l.ab ? l.a : l.b;
      const to = l.ab ? l.b : l.a;
      if (from === f) {
        const p0 = posOf(from, now, v), p1 = posOf(to, now, v);
        for (let k = 0; k < 2; k++) {
          const t = ((now * 0.00055 + k * 0.5) % 1);
          const u = 1 - t;
          const px = u * u * p0.x + 2 * u * t * cp.x + t * t * p1.x;
          const py = u * u * p0.y + 2 * u * t * cp.y + t * t * p1.y;
          ctx.fillStyle = hexA(from.color, 0.85 * Math.sin(t * Math.PI));
          circle(px, py, 1.7);
          ctx.fill();
        }
      }
    }
  }

  // 节点：实心墨点
  for (const n of G.nodes) {
    const p = posOf(n, now, v);
    const lit = nodeLit(n);
    const isFocus = n === focusNode();
    const r = n.r * (isFocus ? 1.15 : 1);
    ctx.globalAlpha = lit ? 1 : 0.16;
    ctx.fillStyle = n.color;
    circle(p.x, p.y, r);
    ctx.fill();
    // 一道深色内圈，让墨点有边界
    ctx.strokeStyle = 'rgba(10,9,12,0.55)';
    ctx.lineWidth = 1;
    circle(p.x, p.y, r - 0.5);
    ctx.stroke();
    ctx.globalAlpha = 1;

    if (n === sel) {
      ctx.strokeStyle = hexA(n.color, 0.9);
      ctx.lineWidth = 1.4;
      circle(p.x, p.y, r + 5);
      ctx.stroke();
    }
  }

  for (const n of G.nodes) {
    const isFocus = n === focusNode();
    const show = showLabels && (v.labels === 'always' || isFocus);
    if (!show) continue;
    const p = posOf(n, now, v);
    label(n.t, p.x, p.y + n.r + 13, isFocus ? 11.5 : 10.5, isFocus ? 0.95 : 0.45, 'rgba(14,13,17,0.92)');
  }
}

/* ==================================================================
   主循环
   ================================================================== */

const DRAW = { breathe: drawBreathe, nebula: drawNebula, glass: drawGlass, ink: drawInk };

let lastT = performance.now();

function frame(now) {
  const v = VARIANTS[variant];

  // 物理：floor > 0 的方案永远在微微动，= 0 的会停
  if (!paused) {
    alpha = Math.max(v.floor, alpha * 0.986);
    if (alpha > 0.0005) step(G, alpha);
  }

  // 相机缓动
  if (cam) {
    const t = Math.min(1, (now - cam.t0) / cam.dur);
    const e = easeOutCubic(t);
    view.s = cam.from.s + (cam.to.s - cam.from.s) * e;
    view.x = cam.from.x + (cam.to.x - cam.from.x) * e;
    view.y = cam.from.y + (cam.to.y - cam.from.y) * e;
    if (t >= 1) cam = null;
  }

  // 松手后残影逐帧退场
  if (!dragNode && trail.length) trail.shift();

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#08080C';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(view.x, view.y);
  ctx.scale(view.s, view.s);
  DRAW[variant](now);
  ctx.restore();

  lastT = now;
  requestAnimationFrame(frame);
}

/* ==================================================================
   交互
   ================================================================== */

let dragNode = null, panFrom = null, panStart = null, moved = false;

canvas.addEventListener('pointerdown', e => {
  const n = nodeAt(e.offsetX, e.offsetY);
  moved = false;
  if (n) {
    dragNode = n;
    n.pin = true;
    const w = toWorld(e.offsetX, e.offsetY);
    n.x = w.x; n.y = w.y;
    n.vx = 0; n.vy = 0;
    canvas.classList.add('dragging');
  } else {
    panFrom = { x: e.offsetX, y: e.offsetY };
    panStart = { ...view };
    cam = null;
  }
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', e => {
  if (dragNode) {
    moved = true;
    const w = toWorld(e.offsetX, e.offsetY);
    dragNode.x = w.x; dragNode.y = w.y;
    dragNode.vx = 0; dragNode.vy = 0;
    alpha = Math.max(alpha, 0.5);
    if (variant === 'nebula') {
      trail.push({ x: w.x, y: w.y, r: dragNode.r, color: dragNode.color });
      if (trail.length > 9) trail.shift();
    }
    return;
  }
  if (panFrom) {
    const dx = e.offsetX - panFrom.x, dy = e.offsetY - panFrom.y;
    if (Math.hypot(dx, dy) > 3) moved = true;
    if (moved) { view.x = panStart.x + dx; view.y = panStart.y + dy; }
    return;
  }
  const n = nodeAt(e.offsetX, e.offsetY);
  hover = n;
  canvas.classList.toggle('pointing', !!n);
});

canvas.addEventListener('pointerup', e => {
  if (dragNode) {
    dragNode.pin = false;
    alpha = Math.max(alpha, 0.42);
    dragNode = null;
    canvas.classList.remove('dragging');
  } else if (panFrom && !moved) {
    setSel(null);
  } else if (panFrom && moved) {
    // 平移结束，不动选中
  }
  panFrom = null;
  canvas.releasePointerCapture?.(e.pointerId);
});

canvas.addEventListener('pointerleave', () => { hover = null; });

canvas.addEventListener('click', e => {
  const n = nodeAt(e.offsetX, e.offsetY);
  if (n) setSel(n);
});

canvas.addEventListener('dblclick', e => {
  const n = nodeAt(e.offsetX, e.offsetY);
  if (!n) return;
  toast('打开笔记：' + n.t);
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(e.offsetX, e.offsetY, Math.exp(-e.deltaY * 0.0016));
}, { passive: false });

/* ---------------- 顶栏 / 卡片 / 图例 ---------------- */

const tabs = document.getElementById('tabs');
const card = document.getElementById('card');

ORDER.forEach((key, i) => {
  const v = VARIANTS[key];
  const b = document.createElement('button');
  b.type = 'button';
  b.setAttribute('role', 'tab');
  b.innerHTML = `<span class="k">${i + 1}</span>${v.name}`;
  b.onclick = () => select(key);
  tabs.appendChild(b);
});

function select(key) {
  variant = key;
  [...tabs.children].forEach((b, i) => b.setAttribute('aria-selected', String(ORDER[i] === key)));
  const v = VARIANTS[key];
  card.innerHTML = `
    <h2>${v.name}<span class="tag">${v.tag}</span></h2>
    <p class="lede">${v.lede}</p>
    <dl>
      <dt>动的是</dt><dd><b>${v.motion}</b></dd>
      <dt>改什么</dt><dd><ul style="margin:0;padding-left:15px">${v.changes.map(c => `<li>${c}</li>`).join('')}</ul></dd>
      <dt>代价</dt><dd class="cost">${v.cost}</dd>
    </dl>`;
  // 不重置 alpha：切换方案时布局应当停在原地，这样比的才是「观感」。
  // 玻璃方案 floor=0，切过去几秒内会自然停下来——那正是它和其它三个的区别。
  ripples = [];
}

const legend = document.getElementById('legend');
legend.innerHTML = Object.entries(FOLDERS).map(([, f]) =>
  `<span><i style="background:${f.color}"></i>${f.name}</span>`).join('');

document.getElementById('btnLabels').onclick = e => {
  showLabels = !showLabels;
  e.currentTarget.setAttribute('aria-pressed', String(showLabels));
};

document.getElementById('btnPause').onclick = e => {
  paused = !paused;
  e.currentTarget.setAttribute('aria-pressed', String(paused));
  e.currentTarget.textContent = paused ? '继续' : '暂停';
};

document.getElementById('btnRelayout').onclick = () => {
  seed(G, 260);
  settle(G, 700);
  fit();
  setSel(null);
  alpha = 0.5;
};

const toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1600);
}

/* ---------------- 尺寸 ---------------- */

function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, Math.round(r.width));
  H = Math.max(1, Math.round(r.height));
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
}

new ResizeObserver(() => {
  const before = { w: W, h: H };
  resize();
  if (before.w !== W || before.h !== H) fit();
}).observe(canvas.parentElement);

resize();
fit();
select('breathe');
requestAnimationFrame(frame);

// 键盘 1..4 切换
window.addEventListener('keydown', e => {
  const i = '1234'.indexOf(e.key);
  if (i >= 0) select(ORDER[i]);
});
</script>
